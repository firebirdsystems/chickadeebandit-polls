<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polls Widget</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #000000);
      font: 12px/1.35 var(--hub-font, system-ui, sans-serif);
    }
    .head, .foot { padding: 9px 12px; border-bottom: 1px solid var(--hub-border, #e5e7eb); }
    .foot { border-top: 1px solid var(--hub-border, #e5e7eb); border-bottom: 0; margin-top: auto; }
    .list { overflow: auto; }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
      color: inherit;
      text-decoration: none;
    }
    .row:hover { background: var(--hub-bg, #f8fafc); }
    .main { flex: 1; min-width: 0; }
    .question { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { color: #94a3b8; font-size: 10.5px; margin-top: 2px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
    .dot.voted { background: #059669; }
    .badge { color: #059669; font-size: 10px; font-weight: 700; }
    .badge.ended { color: #b45309; }
    .meta.urgent { color: #dc2626; font-weight: 700; }
    .empty { padding: 30px 12px; text-align: center; color: #94a3b8; }
    .foot a { color: inherit; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div id="root"><div class="empty">Loading…</div></div>
  <script type="module">
    import { esc, glyph, chickadee } from "/hub-sdk.js";
    import { parseOptions, sortOpenPolls, pollEnded, countdownLabel, countdownUrgent } from "./logic.js";

    const DB = window.__DB_URL ?? "";
    const APP_ID = window.__APP_ID ?? "family-polls";
    const ME = window.__CURRENT_MEMBER ?? null;

    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const response = await fetch(DB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.error) throw new Error(body.error ?? "Unable to load polls");
      return body;
    }

    let loaded = { polls: [], receipts: [] };

    async function load() {
      const [pollResult, voteResult] = await Promise.all([
        db("SELECT * FROM app_family_polls__polls WHERE status = 'open' ORDER BY created_at DESC LIMIT 5"),
        // Own receipts: an anonymous ballot records no member id, so "have I
        // voted?" can only be answered by the receipt table (owner_only, so
        // this returns just this member's rows). Bounded, like the main view.
        db("SELECT poll_id FROM app_family_polls__vote_receipts LIMIT 200"),
      ]);
      loaded = { polls: pollResult.rows ?? [], receipts: voteResult.rows ?? [] };
      render(loaded.polls, loaded.receipts);
    }

    function render(polls, receipts) {
      const now = new Date();
      // Same order as the app: time's-up first, then soonest-closing, then the
      // rest. The widget has no inputs, so a periodic full repaint is fine.
      const rows = polls.length
        ? sortOpenPolls(polls, now).map(poll => {
            const voted = Boolean(ME) && receipts.some(receipt => receipt.poll_id === poll.id);
            const isEnded = pollEnded(poll, now);
            const countdown = countdownLabel(poll.closes_at, now);
            const href = `/run/${APP_ID}?pollId=${encodeURIComponent(poll.id)}`;
            return `
              <a class="row" href="${href}">
                <span class="dot ${voted ? "voted" : ""}"></span>
                <span class="main">
                  <span class="question">${esc(poll.question)}</span>
                  <span class="meta ${countdownUrgent(poll.closes_at, now) && !isEnded ? "urgent" : ""}">${parseOptions(poll.options_json).length} choices${countdown && !isEnded ? ` · ${esc(countdown)}` : ""}</span>
                </span>
                ${isEnded ? '<span class="badge ended">Time\'s up</span>' : voted ? `<span class="badge">Voted ${glyph("tick")}</span>` : ""}
              </a>`;
          }).join("")
        : `<div class="empty">${chickadee("sleeping", { size: 64 })}<div>No open polls</div></div>`;

      document.getElementById("root").innerHTML = `
        <div class="head"><strong>${glyph("ballot-box")} Polls</strong></div>
        <div class="list">${rows}</div>
        <div class="foot"><a href="/run/${APP_ID}">Open polls →</a></div>`;
    }

    load().then(() => {
      // Countdowns drift without a repaint; once a minute is plenty at the
      // widget's coarseness. A repaint from the rows already in hand — no
      // re-read, so an idle dashboard costs the hub nothing.
      setInterval(() => render(loaded.polls, loaded.receipts), 60_000);
    }).catch(() => {
      document.getElementById("root").innerHTML = '<div class="empty">Unable to load polls</div>';
    });
  </script>
</body>
</html>
