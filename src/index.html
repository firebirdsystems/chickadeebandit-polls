<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polls</title>
  <base href="/run/family-polls/">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: var(--hub-bg, #f8fafc);
      --card: var(--hub-surface, #fff);
      --border: var(--hub-border, #e2e8f0);
      --text: var(--hub-text, #0f172a);
      --muted: var(--hub-text-muted, #64748b);
      --primary: var(--hub-primary, #111827);
      --primary-fg: var(--hub-primary-fg, #fff);
      --green: #059669;
      --green-bg: #d1fae5;
      --red: #dc2626;
      --radius: var(--hub-radius, 12px);
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 var(--hub-font, system-ui, sans-serif);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 680px; margin: 0 auto; padding: 18px; }
    .header, .card-head, .row, .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header { margin-bottom: 18px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.35rem; }
    h2 { font-size: 1.12rem; }
    .muted { color: var(--muted); font-size: .84rem; }
    .btn {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 13px;
      background: var(--card);
      color: var(--text);
      font-weight: 650;
    }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn:disabled { opacity: .5; cursor: default; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .poll-card { padding: 15px; cursor: pointer; }
    .poll-card:hover { border-color: #94a3b8; }
    .card-head { padding: 16px; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .card-body { padding: 16px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
    }
    .badge-voted { background: var(--green-bg); color: var(--green); }
    .option {
      width: 100%;
      display: block;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      padding: 12px;
      margin-top: 9px;
    }
    .option:not(:disabled):hover { border-color: var(--primary); }
    .option.selected { border-color: var(--green); background: #ecfdf5; }
    .option.winner { box-shadow: inset 4px 0 var(--green); }
    .option-line { display: flex; justify-content: space-between; gap: 12px; }
    .bar { height: 6px; background: #e2e8f0; border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .bar > div { height: 100%; background: var(--green); }
    .empty { padding: 48px 18px; text-align: center; color: var(--muted); }
    .back { border: 0; background: transparent; color: var(--muted); padding: 0; margin-bottom: 12px; }
    .notice, .error {
      padding: 10px 12px;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: .84rem;
    }
    .notice { background: #f1f5f9; color: var(--muted); }
    .error { background: #fee2e2; color: var(--red); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .48);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .modal {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
    }
    .field { margin-top: 14px; }
    .field label { display: block; margin-bottom: 5px; font-size: .82rem; font-weight: 700; color: var(--muted); }
    .field input, .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px;
      background: var(--card);
      color: var(--text);
    }
    .option-input { display: flex; gap: 8px; margin-top: 8px; }
    .option-input input { flex: 1; }
    .actions { justify-content: flex-end; margin-top: 18px; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
    .option-guest { display: block; margin-top: 6px; text-align: left; }
    .link-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .link-row input { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
    .tiny { font-size: .78rem; }
  </style>
</head>
<body>
  <main class="app" id="app"><div class="empty">Loading polls…</div></main>

  <script type="module">
    import { esc, isAdult, hubConfirm, hubAlert, createShareHelper, searchMatch } from "/hub-sdk.js";
    import { parseOptions, selectedOptionId, voteCounts, winningOptionIds, spoiledVotes, countedVotes, searchableFields, turnoutLabel, missingOptionRows, guestVoteLabel } from "./logic.js";

    const DB = window.__DB_URL ?? "";
    const CONTEXT = window.__CONTEXT_URL ?? "";
    const SUBMIT_RESPONSE = window.__SUBMIT_RESPONSE_URL ?? "";
    const RESPONSE_PROGRESS = window.__RESPONSE_PROGRESS_URL ?? "";
    const EVENTS = window.__EVENTS_URL ?? "/api/events";
    const APP_ID = window.__APP_ID ?? "family-polls";
    const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
    const IS_ADMIN = window.__IS_ADMIN === true;
    const IS_ROSTER = window.__SPACE_KIND === "roster";
    // Who may create and close polls. In a roster (classroom / team / clients)
    // only the steward — the space admin — authors polls; everyone else just
    // votes. Elsewhere any adult may. The hub enforces this server-side
    // (adult_writable + steward_writes_only on `polls`); this only hides
    // controls that would 403.
    const canSteward = (m) => IS_ROSTER ? IS_ADMIN : isAdult(m);

    let members = [];
    let memberMap = new Map();
    let me = HUB_MEMBER;
    let polls = [];
let searchQ = "";       // in-app search (see logic.js searchableFields)
    let votes = [];
    let guestVotes = [];       // ballots cast through a share link; sealed like the rest
    let myReceipts = new Set();
    let turnout = new Map();   // poll id -> voters so far; absent means unknown
    let selectedPollId = null;

    /** Read bounds — see loadData. */
    const POLL_LIMIT = 200;
    const VOTE_LIMIT = 2000;
    // The guest-vote row policy caps this table at 5,000 rows. Loading that
    // entire bounded table keeps every closed poll's result complete; a lower
    // global limit would eventually omit newer ballots from the tally.
    const GUEST_VOTE_LIMIT = 5000;
    // Turnout costs one request per poll, so the list preloads only the newest
    // open polls. Anything past the cap is fetched when that poll is opened,
    // and renders no turnout until then — never a placeholder zero.
    const TURNOUT_PRELOAD = 25;
    let modal = null;
    let errorMessage = "";

    // Share links. `enabled` is false when the hub injected no share URLs
    // (demo mode, or an older hub); guest voting on top of a link is premium,
    // which `status().entitled` answers.
    const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
    let shareModal = null;
    let shareLinks = [];
    let shareEntitled = false;

    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const response = await fetch(DB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.error) {
        throw new Error(body.error ?? `Database request failed (${response.status})`);
      }
      return body;
    }

    async function loadContext() {
      if (!CONTEXT) return;
      const response = await fetch(`${CONTEXT}?keys=family.members`);
      if (!response.ok) throw new Error("Unable to load household members");
      const body = await response.json();
      members = body["family.members"] ?? [];
      memberMap = new Map(members.map(member => [member.id, member]));
      if (HUB_MEMBER) me = memberMap.get(HUB_MEMBER.id) ?? HUB_MEMBER;
    }

    async function loadData() {
      if (!DB) {
        const now = new Date().toISOString();
        polls = [{
          id: "demo-poll",
          question: "What should we have for dinner?",
          options_json: JSON.stringify([
            { id: "pizza", text: "Pizza" },
            { id: "tacos", text: "Tacos" },
            { id: "pasta", text: "Pasta" },
          ]),
          status: "open",
          created_by: "demo-adult",
          created_at: now,
        }];
        members = [{ id: "demo-adult", name: "Alex", role: "adult" }];
        memberMap = new Map(members.map(member => [member.id, member]));
        me = members[0];
        return;
      }
      // Bounded. Both reads were unbounded: a household that has been polling
      // for years pulled every poll and every ballot ever cast on each page
      // load, and the votes query grows with polls × members.
      const [pollResult, voteResult, receiptResult, guestResult] = await Promise.all([
        db(`SELECT * FROM app_family_polls__polls ORDER BY created_at DESC LIMIT ${POLL_LIMIT}`),
        db(`SELECT poll_id, member_id, option_id, created_at FROM app_family_polls__poll_votes ORDER BY created_at LIMIT ${VOTE_LIMIT}`),
        // Own receipts only (the policy is owner_only, adults_bypass:false).
        // This is how "have I voted?" is answered on an anonymous poll, where
        // the ballot carries no member id to recognise.
        db(`SELECT poll_id FROM app_family_polls__vote_receipts LIMIT ${POLL_LIMIT}`),
        // Ballots from share links. Governed by the same seal as member
        // ballots, so an open poll returns none of them — the query is not
        // conditional on the poll being closed, the row policy is.
        db(`SELECT poll_id, option_id FROM app_family_polls__guest_votes ORDER BY created_at LIMIT ${GUEST_VOTE_LIMIT}`),
      ]);
      polls = pollResult.rows ?? [];
      votes = voteResult.rows ?? [];
      guestVotes = guestResult.rows ?? [];
      myReceipts = new Set((receiptResult.rows ?? []).map(row => row.poll_id));
      await loadTurnout();
    }

    /**
     * Voters so far on one open poll, from the hub's response-progress
     * endpoint. See `turnoutLabel` in logic.js for why the count cannot come
     * from a query here, and why an unknown count must stay unknown — every
     * failure path below leaves the poll out of the map rather than at 0.
     */
    async function fetchTurnout(pollId) {
      if (!RESPONSE_PROGRESS) return;
      try {
        const response = await fetch(`${RESPONSE_PROGRESS}?session_id=${encodeURIComponent(pollId)}`);
        if (!response.ok) return;
        const body = await response.json();
        const responded = Number(body.responded);
        if (Number.isFinite(responded)) turnout.set(pollId, responded);
        // The receipts read is capped at POLL_LIMIT rows and this is not: for
        // the poll in hand it is the authoritative answer to "have I voted?".
        if (body.you_responded) myReceipts.add(pollId);
      } catch { /* leave this poll's count unknown rather than wrong */ }
    }

    async function loadTurnout() {
      turnout = new Map();
      // Closed polls are excluded on purpose: their ballots are unsealed, so
      // the results view counts them directly and a second number could
      // disagree with it (spoiled ballots hold a receipt but are not counted).
      const open = polls.filter(poll => poll.status !== "closed").slice(0, TURNOUT_PRELOAD);
      await Promise.all(open.map(poll => fetchTurnout(poll.id)));
    }

    /** Turnout for a poll opened past the preload cap; repaints if it lands. */
    async function ensureTurnout(pollId) {
      const poll = polls.find(item => item.id === pollId);
      if (!poll || poll.status === "closed" || turnout.has(pollId)) return;
      await fetchTurnout(pollId);
      if (selectedPollId === pollId) render();
    }

    function pollOptions(poll) {
      return parseOptions(poll.options_json);
    }

    function votesFor(pollId) {
      return votes.filter(vote => vote.poll_id === pollId);
    }

    function guestVotesFor(pollId) {
      return guestVotes.filter(vote => vote.poll_id === pollId);
    }

    function creatorName(poll) {
      return memberMap.get(poll.created_by)?.name ?? "Adult";
    }

    // render() rewrites the whole view, so put the caret back after typing.
    document.addEventListener("input", (e) => {
      if (e.target.id !== "search") return;
      searchQ = e.target.value;
      const caret = e.target.selectionStart;
      render();
      const next = document.getElementById("search");
      if (next) { next.focus(); next.setSelectionRange(caret, caret); }
    });

    function render() {
      errorMessage = errorMessage || "";
      const app = document.getElementById("app");
      const poll = polls.find(item => item.id === selectedPollId);
      app.innerHTML = poll ? detailHtml(poll) : listHtml();
      bindActions();
    }

    /** Whether this poll records no voter at all. */
    function isAnonymous(poll) { return Number(poll?.anonymous) === 1; }

    /**
     * Whether this member has already voted. An anonymous ballot carries no
     * member id, so scanning the votes cannot answer it — the receipt does,
     * and it is the same row the hub uses to refuse a second vote.
     */
    function hasVoted(poll) {
      if (!me) return false;
      return myReceipts.has(poll.id) || selectedOptionId(votesFor(poll.id), me.id) !== null;
    }

    /**
     * "3 votes so far", or "" when this poll's count is unknown or it is
     * closed. Shown on anonymous polls too — that is the case where a member
     * is most in the dark about whether anyone else has voted, and the count
     * names nobody.
     */
    function turnoutText(poll) {
      if (poll.status === "closed") return "";
      return turnout.has(poll.id) ? turnoutLabel(turnout.get(poll.id)) : "";
    }

    function pollCard(poll, index) {
      const closed = poll.status === "closed";
      const turnoutSuffix = turnoutText(poll) ? ` · ${turnoutText(poll)}` : "";
      const badge = closed
        ? '<span class="badge">Closed</span>'
        : hasVoted(poll) ? '<span class="badge badge-voted">Voted ✓</span>' : '<span class="badge">Open</span>';
      return `
        <article class="card poll-card" data-open-poll="${index}">
          <div class="row">
            <div>
              <h2>${esc(poll.question)}</h2>
              <div class="muted">Created by ${esc(creatorName(poll))} · ${pollOptions(poll).length} choices${isAnonymous(poll) ? " · anonymous" : ""}${turnoutSuffix}</div>
            </div>
            ${badge}
          </div>
        </article>`;
    }

    function listHtml() {
      // pollCard takes the index into `polls`, so filter on a matching test
      // rather than on a reindexed copy.
      const shows = (poll) => !searchQ || searchMatch(
        searchQ, searchableFields(poll, parseOptions(poll).map(o => o.label).join(" ")));
      const openCards = polls
        .map((poll, index) => (poll.status === "closed" || !shows(poll) ? "" : pollCard(poll, index)))
        .join("");
      const closedCards = polls
        .map((poll, index) => (poll.status === "closed" && shows(poll) ? pollCard(poll, index) : ""))
        .join("");

      return `
        <header class="header">
          <div><h1>🗳️ Polls</h1><div class="muted">One final vote per member · results revealed when the poll closes</div></div>
          ${canSteward(me) ? '<button class="btn btn-primary" id="new-poll">+ New Poll</button>' : ""}
        </header>
        ${errorMessage ? `<div class="error">${esc(errorMessage)}</div>` : ""}
        ${polls.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search polls…" aria-label="Search polls" value="${esc(searchQ)}" /></div>` : ""}
        ${openCards || (searchQ ? `<div class="card empty">No open polls match "${esc(searchQ)}".</div>` : '<div class="card empty">No open polls yet.</div>')}
        ${closedCards ? `<h2 style="margin:18px 0 10px">Closed polls</h2>${closedCards}` : ""}`;
    }

    function detailHtml(poll) {
      const options = pollOptions(poll);
      const allVotes = votesFor(poll.id);
      const anonymous = isAnonymous(poll);
      // An anonymous poll shows no per-member selection, because there is none
      // to show; `mine` stays null and the ✓ moves to the badge.
      const mine = anonymous ? null : selectedOptionId(allVotes, me?.id);
      const voted = hasVoted(poll);
      const closed = poll.status === "closed";
      // Ballots naming an option that is not on this poll are excluded from
      // both the counts and the total, so the percentages always add up.
      const pollVotes = countedVotes(options, allVotes);
      const allGuestVotes = guestVotesFor(poll.id);
      const guestBallots = countedVotes(options, allGuestVotes);
      const spoiled = spoiledVotes(options, [...allVotes, ...allGuestVotes]);
      // Guests count, and are also counted separately: the result is the sum,
      // and every place it is shown says how much of it came through a link.
      const guestCounts = voteCounts(options, guestBallots);
      const counts = voteCounts(options, [...pollVotes, ...guestBallots]);
      const winners = new Set(winningOptionIds(options, counts));
      const total = pollVotes.length + guestBallots.length;

      const optionsHtml = options.map((option, index) => {
        const count = counts[option.id] ?? 0;
        const pct = total ? Math.round(count / total * 100) : 0;
        const fromLink = closed ? guestVoteLabel(guestCounts[option.id] ?? 0) : "";
        return `
          <button class="option ${mine === option.id ? "selected" : ""} ${closed && winners.has(option.id) ? "winner" : ""}"
                  data-vote-option="${index}" ${closed || voted || !me ? "disabled" : ""}>
            <span class="option-line">
              <span>${esc(option.text)}${mine === option.id ? " ✓" : ""}</span>
              ${closed ? `<strong>${count}</strong>` : ""}
            </span>
            ${closed ? `<span class="bar"><div style="width:${pct}%"></div></span>` : ""}
            ${fromLink ? `<span class="muted option-guest">${esc(fromLink)}</span>` : ""}
          </button>`;
      }).join("");

      // Copy that matches what actually happens. The app used to say votes
      // "stay sealed", which members read as "nobody will know how I voted" —
      // but an attributed poll unseals every ballot, voter and all, the moment
      // it closes. Each mode now says what it does.
      const privacyLine = anonymous
        ? "This poll is anonymous — no record is kept of who voted for what."
        : "When the poll closes, everyone can see how each member voted.";
      const spoiledLine = closed && spoiled.length > 0
        ? `<div class="notice">${spoiled.length} vote${spoiled.length === 1 ? "" : "s"} named a choice that isn't on this poll and ${spoiled.length === 1 ? "was" : "were"} not counted.</div>`
        : "";
      // Turnout leads the notice on an open poll: "am I the only one who has
      // voted?" is the question the sealed view otherwise leaves unanswered.
      // It is a count of voters, never of choices, so it reveals no result.
      const turnoutSentence = turnoutText(poll) ? `${turnoutText(poll)}. ` : "";
      // Provenance belongs in the headline number too, not only under the bars:
      // a result that is mostly link traffic reads very differently.
      const guestSentence = closed && guestBallots.length > 0
        ? `${guestBallots.length} of them came from a shared link, where anyone with the link could vote. `
        : "";
      const notice = (closed
        ? `<div class="notice">This poll is closed. ${total} vote${total === 1 ? "" : "s"} counted. ${guestSentence}${anonymous ? "Votes were anonymous." : ""}</div>`
        : voted
          ? `<div class="notice">${turnoutSentence}Your vote is final. Results are revealed when the poll closes. ${privacyLine}</div>`
          : `<div class="notice">${turnoutSentence}Choose one option. Your vote cannot be changed after submission. ${privacyLine}</div>`) + spoiledLine;

      return `
        <button class="back" id="back">← All polls</button>
        ${errorMessage ? `<div class="error">${esc(errorMessage)}</div>` : ""}
        <section class="card">
          <div class="card-head">
            <div>
              <h1>${esc(poll.question)}</h1>
              <div class="muted">Created by ${esc(creatorName(poll))}</div>
            </div>
            ${closed ? '<span class="badge">Closed</span>' : voted ? '<span class="badge badge-voted">Voted ✓</span>' : '<span class="badge">Open</span>'}
          </div>
          <div class="card-body">
            ${notice}
            ${optionsHtml}
            ${!closed && canSteward(me) ? `<div class="actions">
              ${share.enabled ? '<button class="btn" id="share-poll">🔗 Share</button>' : ""}
              <button class="btn" id="close-poll">Close poll &amp; reveal results</button>
            </div>` : ""}
          </div>
        </section>`;
    }

    function bindActions() {
      document.getElementById("new-poll")?.addEventListener("click", openCreateModal);
      document.getElementById("back")?.addEventListener("click", () => {
        selectedPollId = null;
        errorMessage = "";
        render();
      });
      document.querySelectorAll("[data-open-poll]").forEach(element => {
        element.addEventListener("click", () => {
          selectedPollId = polls[Number(element.dataset.openPoll)]?.id ?? null;
          errorMessage = "";
          render();
          if (selectedPollId) ensureTurnout(selectedPollId);
        });
      });
      document.querySelectorAll("[data-vote-option]").forEach(element => {
        element.addEventListener("click", () => submitVote(Number(element.dataset.voteOption)));
      });
      document.getElementById("close-poll")?.addEventListener("click", closePoll);
      document.getElementById("share-poll")?.addEventListener("click", () => openShareModal(selectedPollId));
    }

    // --- Share links ---------------------------------------------------------

    function closeShareModal() {
      shareModal?.remove();
      shareModal = null;
    }

    /**
     * Project this poll's choices into `poll_options`, which is where the
     * public form reads them from (manifest `submit.fields[].values_from`).
     *
     * The blob is still the authority — this only mirrors it, keyed on the
     * option ids the blob already assigned, so it is safe to run every time the
     * dialog opens and it brings polls created before share links existed along
     * with it. Only a steward gets here, which is what the table's row policy
     * allows anyway.
     */
    async function ensureOptionRows(poll) {
      const options = pollOptions(poll);
      if (!options.length) return;
      const existing = await db(
        "SELECT id FROM app_family_polls__poll_options WHERE poll_id = ?", [poll.id]);
      const missing = missingOptionRows(options, new Set((existing.rows ?? []).map(row => row.id)));
      if (!missing.length) return;
      const values = missing.map(() => "(?, ?, ?, ?, 'open')").join(", ");
      await db(
        `INSERT INTO app_family_polls__poll_options (id, poll_id, text, position, status) VALUES ${values}`,
        missing.flatMap(row => [row.id, poll.id, row.text, row.position]),
      );
    }

    async function openShareModal(pollId) {
      const poll = polls.find(item => item.id === pollId);
      if (!poll || poll.status === "closed" || !canSteward(me)) return;
      try {
        await ensureOptionRows(poll);
      } catch (error) {
        hubAlert("Couldn't prepare this poll for sharing", { description: error?.message ?? "" });
        return;
      }
      const status = await share.status();
      shareLinks = status.links;
      shareEntitled = status.entitled;
      const active = shareLinks.filter(link =>
        link.itemId === pollId && !link.revokedAt && new Date(link.expiresAt) > new Date());

      const rows = active.map(link => `
        <div class="link-row">
          <div style="flex:1;min-width:0">
            <input readonly value="${esc(link.url)}" onclick="this.select()" class="tiny" />
            <div class="tiny muted" style="margin-top:3px">
              Expires ${new Date(link.expiresAt).toLocaleDateString()} · ${link.viewCount} view${link.viewCount === 1 ? "" : "s"}${
                link.writable ? ` · ${link.submissionCount} guest vote${link.submissionCount === 1 ? "" : "s"}` : " · read-only"}${
                link.hasPassword ? " · 🔒 password" : ""}
            </div>
          </div>
          <button class="btn" data-share-copy="${esc(link.id)}">Copy</button>
          <button class="btn" data-share-revoke="${esc(link.id)}">Revoke</button>
        </div>`).join("");

      // Guest voting rides on the premium `sharing` capability. Without it a
      // link is read-only — the question and nothing else — so say that rather
      // than offering a checkbox the hub would refuse.
      const premiumControls = shareEntitled ? `
        <div class="field">
          <label style="display:flex;align-items:center;gap:8px;font-weight:500">
            <input type="checkbox" id="share-writable" checked>
            Let people with the link vote
          </label>
          <input id="share-password" type="text" class="tiny" autocomplete="off"
                 placeholder="Optional password (min 6 characters)" style="margin-top:8px">
        </div>
      ` : `<p class="tiny muted" style="margin-top:10px">
             This link will show the question only. Collecting votes from outside the household is part of premium sharing.
           </p>`;

      closeShareModal();
      shareModal = document.createElement("div");
      shareModal.className = "modal-backdrop";
      shareModal.innerHTML = `
        <div class="modal">
          <h2>Share "${esc(poll.question)}"</h2>
          <p class="tiny muted" style="margin:6px 0 10px">
            Visitors see the question and its choices — never who voted, never the running result.
            A guest vote is anonymous and nothing stops one visitor voting twice, so treat a shared
            poll as a straw poll. The link stops working the moment the poll is closed.
          </p>
          ${rows || `<p class="tiny muted" style="padding:8px 0">No active links yet.</p>`}
          ${premiumControls}
          <div class="row" style="margin-top:14px;gap:8px">
            <select id="share-expiry" class="tiny" style="width:auto">
              <option value="24">1 day</option>
              <option value="168" selected>7 days</option>
              <option value="720">30 days</option>
              ${shareEntitled ? `<option value="8760">1 year</option>` : ""}
            </select>
            <button class="btn btn-primary" id="share-create">Create link</button>
          </div>
          <div class="actions"><button class="btn" id="share-close">Close</button></div>
        </div>`;
      document.body.appendChild(shareModal);
      shareModal.addEventListener("click", event => { if (event.target === shareModal) closeShareModal(); });
      shareModal.querySelector("#share-close").addEventListener("click", closeShareModal);
      shareModal.querySelector("#share-create").addEventListener("click", () => createShare(pollId));
      shareModal.querySelectorAll("[data-share-copy]").forEach(element => {
        element.addEventListener("click", () => copyShare(element.dataset.shareCopy));
      });
      shareModal.querySelectorAll("[data-share-revoke]").forEach(element => {
        element.addEventListener("click", () => revokeShare(element.dataset.shareRevoke, pollId));
      });
    }

    async function createShare(pollId) {
      const poll = polls.find(item => item.id === pollId);
      const hours = Number(shareModal?.querySelector("#share-expiry")?.value) || undefined;
      const writable = !!shareModal?.querySelector("#share-writable")?.checked;
      const password = shareModal?.querySelector("#share-password")?.value?.trim() || undefined;
      const button = shareModal?.querySelector("#share-create");
      if (button) { button.disabled = true; button.textContent = "Creating…"; }
      try {
        const link = await share.create("poll", pollId, {
          expiresInHours: hours, label: poll?.question, writable, password,
        });
        try { await navigator.clipboard.writeText(link.url); } catch { /* the row below shows it */ }
        await openShareModal(pollId);
      } catch (error) {
        if (button) { button.disabled = false; button.textContent = "Create link"; }
        hubAlert("Couldn't create share link", { description: error?.message ?? "" });
      }
    }

    async function copyShare(id) {
      const link = shareLinks.find(item => item.id === id);
      if (!link) return;
      try { await navigator.clipboard.writeText(link.url); }
      catch { hubAlert("Couldn't copy — select the link text and copy it manually."); }
    }

    async function revokeShare(id, pollId) {
      const confirmed = await hubConfirm({
        message: "Revoke this share link?",
        description: "Anyone using it loses access immediately. Votes already cast through it stay counted.",
        confirmLabel: "Revoke",
        destructive: true,
      });
      if (!confirmed) return;
      try { await share.revoke(id); await openShareModal(pollId); }
      catch (error) { hubAlert("Couldn't revoke share link", { description: error?.message ?? "" }); }
    }

    async function closePoll() {
      const poll = polls.find(item => item.id === selectedPollId);
      if (!poll || poll.status === "closed" || !canSteward(me)) return;
      // Irreversible on two counts: `frozen_when` locks the poll at "closed" so
      // it can never reopen, and closing is what unseals every ballot to the
      // household. It was one unconfirmed click.
      const confirmed = await hubConfirm({
        message: `Close "${poll.question}"?`,
        description: (isAnonymous(poll)
          ? "Voting ends and the results are revealed to everyone. No record of who voted is kept."
          : "Voting ends and every vote — including who cast it — is revealed to everyone in the household.")
          + (share.enabled ? " Any share link for this poll stops working." : "")
          + " This can't be undone.",
        confirmLabel: "Close poll",
        destructive: true,
      });
      if (!confirmed) return;
      const button = document.getElementById("close-poll");
      if (button) button.disabled = true;
      errorMessage = "";
      try {
        await db("UPDATE app_family_polls__polls SET status = 'closed' WHERE id = ?", [poll.id]);
        // Reload so the now-unsealed votes are fetched for the results view.
        await loadData();
      } catch (error) {
        errorMessage = error?.message ?? "Unable to close poll.";
      }
      render();
    }

    function openCreateModal() {
      if (!canSteward(me)) return;
      closeModal();
      modal = document.createElement("div");
      modal.className = "modal-backdrop";
      modal.innerHTML = `
        <div class="modal">
          <h2>Create a poll</h2>
          <div class="field"><label>Question</label><textarea id="poll-question" rows="2" maxlength="300"></textarea></div>
          <div class="field">
            <label>Choices</label>
            <div id="choice-list">
              <div class="option-input"><input maxlength="160" placeholder="Choice 1"></div>
              <div class="option-input"><input maxlength="160" placeholder="Choice 2"></div>
            </div>
            <button class="btn" id="add-choice" style="margin-top:8px">+ Add choice</button>
          </div>
          <div class="field">
            <label style="display:flex;align-items:center;gap:8px;font-weight:500">
              <input type="checkbox" id="poll-anonymous">
              Anonymous poll
            </label>
            <div class="muted" style="margin-top:4px">
              Anonymous: no record is kept of who voted for what — not even for adults.
              Otherwise everyone sees how each member voted once the poll closes.
              This can't be changed after the poll is created.
            </div>
          </div>
          <div class="error" id="modal-error" hidden></div>
          <div class="actions">
            <button class="btn" id="cancel-create">Cancel</button>
            <button class="btn btn-primary" id="save-poll">Create Poll</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });
      modal.querySelector("#cancel-create").addEventListener("click", closeModal);
      modal.querySelector("#add-choice").addEventListener("click", addChoiceInput);
      modal.querySelector("#save-poll").addEventListener("click", createPoll);
      modal.querySelector("#poll-question").focus();
    }

    function addChoiceInput() {
      const list = modal.querySelector("#choice-list");
      if (list.querySelectorAll("input").length >= 10) return;
      const row = document.createElement("div");
      row.className = "option-input";
      const input = document.createElement("input");
      input.maxLength = 160;
      input.placeholder = `Choice ${list.querySelectorAll("input").length + 1}`;
      row.appendChild(input);
      list.appendChild(row);
      input.focus();
    }

    function closeModal() {
      modal?.remove();
      modal = null;
    }

    async function createPoll() {
      const question = modal.querySelector("#poll-question").value.trim();
      const texts = [...modal.querySelectorAll("#choice-list input")]
        .map(input => input.value.trim())
        .filter(Boolean);
      const modalError = modal.querySelector("#modal-error");
      if (!question || texts.length < 2 || new Set(texts.map(text => text.toLowerCase())).size !== texts.length) {
        modalError.hidden = false;
        modalError.textContent = !question
          ? "Enter a question."
          : texts.length < 2
            ? "Enter at least two choices."
            : "Choices must be unique.";
        return;
      }

      const button = modal.querySelector("#save-poll");
      button.disabled = true;
      const id = crypto.randomUUID();
      const options = texts.map(text => ({ id: crypto.randomUUID(), text }));
      const createdAt = new Date().toISOString();
      // Fixed at creation: the flag decides whether each ballot records a voter,
      // so flipping it later could only ever mislead about ballots already cast.
      const anonymous = modal.querySelector("#poll-anonymous").checked ? 1 : 0;

      try {
        await db(
          `INSERT INTO app_family_polls__polls
             (id, question, options_json, status, created_by, created_at, anonymous)
           VALUES (?, ?, ?, 'open', ?, ?, ?)`,
          [id, question, JSON.stringify(options), me.id, createdAt, anonymous],
        );
        polls.unshift({
          id,
          question,
          options_json: JSON.stringify(options),
          status: "open",
          created_by: me.id,
          created_at: createdAt,
          anonymous,
        });
        closeModal();
        selectedPollId = id;
        render();
        fetch(EVENTS, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source_app_id: APP_ID,
            type: "poll.created",
            subject_id: id,
            payload: { poll_id: id, question },
          }),
        }).catch(() => {});
      } catch (error) {
        button.disabled = false;
        modalError.hidden = false;
        modalError.textContent = error?.message ?? "Unable to create poll.";
      }
    }

    async function submitVote(optionIndex) {
      const poll = polls.find(item => item.id === selectedPollId);
      const option = pollOptions(poll)[optionIndex];
      if (!poll || !option || !me || !SUBMIT_RESPONSE) return;
      document.querySelectorAll("[data-vote-option]").forEach(button => { button.disabled = true; });
      errorMessage = "";
      try {
        const response = await fetch(SUBMIT_RESPONSE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: poll.id,
            responses: [{ answer: option.id }],
          }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error ?? `Vote failed (${response.status})`);
        // The receipt is what "you have voted" is read from, and it is recorded
        // for both modes. An anonymous ballot is deliberately NOT added to the
        // local votes list — there is no member id on it to reflect, and
        // pretending otherwise here would be the same lie the copy just fixed.
        myReceipts.add(poll.id);
        // Count this ballot immediately so the turnout line agrees with the
        // "Voted ✓" badge, then reconcile with the hub — which also picks up
        // anyone who voted while this poll was on screen. A failed refetch
        // leaves the local increment standing rather than reverting it.
        if (turnout.has(poll.id)) turnout.set(poll.id, turnout.get(poll.id) + 1);
        await fetchTurnout(poll.id);
        if (!isAnonymous(poll)) {
          votes.push({
            poll_id: poll.id,
            member_id: me.id,
            option_id: option.id,
            created_at: new Date().toISOString(),
          });
        }
      } catch (error) {
        errorMessage = error?.message ?? "Unable to submit vote.";
      }
      render();
    }

    (async () => {
      try {
        await Promise.all([loadContext(), loadData()]);
        render();
        const deepLink = new URLSearchParams(location.search).get("pollId");
        if (deepLink && polls.some(poll => poll.id === deepLink)) {
          selectedPollId = deepLink;
          render();
          await ensureTurnout(deepLink);
        }
      } catch (error) {
        errorMessage = error?.message ?? "Unable to load polls.";
        render();
      }
    })();
  </script>
</body>
</html>
